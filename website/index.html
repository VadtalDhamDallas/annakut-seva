const RTL={ur:1,ar:1};
async function openRecipe(sn, rl){
  const d=BY[sn], dlg=$('#dlg'); rl = rl || (lang);
  $('#dlg-t').textContent = '#'+sn+' · '+nameOf(d)[0];
  const tabs=`<div class="tabs" role="tablist">${[['en','English'],['gu','ગુજરાતી'],['hi','हिंदी']].map(([k,l])=>`<button role="tab" data-rl="${k}" data-sn="${sn}" aria-selected="${k===rl}">${l}</button>`).join('')}</div>
    <div class="morelang"><label for="ml">${esc(t().moreLang)}</label><select id="ml" data-sn="${sn}"><option value="">${esc(t().pickLang)}</option>${MORE.map(([k,l])=>`<option value="${k}"${k===rl?' selected':''}>${l}</option>`).join('')}</select></div>`;
  const top=`<img class="hero-img" src="${imgOf(BY[sn])}" alt="${esc(d[2])}">${tabs}`;
  const body=$('#dlg-b');
  if(!dlg.open) dlg.showModal();
  body.innerHTML = top + `<p><span class="spin"></span>${esc(rl==='gu'?t().loading:t().transl)}</p>`;
  body.dir='ltr';
  try{
    let r;
    if(sn>=2001){
      let cr; try{ cr=recCache[sn+':'+rl]||(recCache[sn+':'+rl]=await api('getRecipe',[sn,rl])); }
      catch(e){ if(!stale(sn,rl)) body.innerHTML=top+`<p class="msg info">${esc(/PENDING/.test(e.message)?t().pending:t().failed)}</p>`; return; }
      if(stale(sn,rl)) return;
      const L=T[rl]||(cr.L?{ing:cr.L[0],method:cr.L[1],time:cr.L[2],serves:cr.L[3],note:cr.L[4]}:T.en);
      body.innerHTML = top + ruleBox() + `<h2 style="margin-top:0">${esc(cr.t)}</h2><div class="meta">${cr.time?`<span>${esc(L.time)}: ${esc(cr.time)}</span>`:''}${cr.serves?`<span>${esc(L.serves)}: ${esc(cr.serves)}</span>`:''}</div>
        <h3>${esc(L.ing)}</h3><ul>${cr.ing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>${esc(L.method)}</h3><ol>${cr.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${cr.note?`<p class="note"><b>${esc(L.note)}:</b> ${esc(cr.note)}</p>`:''}`;
      return;
    }
    if(!guRec){ guRec = await loadStatic('gu'); }
    const g=guRec[sn];
    if(!g || !g.steps.length){ body.innerHTML = top + `<p class="empty">${esc(t().noRec)}</p>`; return; }
    let L=T[rl]||T.en, warn='';
    if(rl==='gu') r=g;
    else {
      const k=sn+':'+rl;
      if(rl==='en'||rl==='hi'){ const st=await loadStatic(rl); if(st&&st[sn]) r=st[sn]; }
      if(!r) try { r = recCache[k] || (recCache[k] = await api('getRecipe',[sn,rl])); }
      catch(e){ r=g; L=T.gu; warn=`<p class="msg info">${esc(t().failed)}</p>`; }
      if(!T[rl] && r.L) L={ing:r.L[0],method:r.L[1],time:r.L[2],serves:r.L[3],note:r.L[4]};
    }
    if(stale(sn,rl)) return;
    body.innerHTML = top + ruleBox() + warn + `<h2 style="margin-top:0">${esc(r.t)}</h2>
      <div class="meta">${r.time?`<span>${esc(L.time)}: ${esc(r.time)}</span>`:''}${r.serves?`<span>${esc(L.serves)}: ${esc(r.serves)}</span>`:''}</div>
      <h3>${esc(L.ing)}</h3><ul>${r.ing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <h3>${esc(L.method)}</h3><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      ${r.note?`<p class="note"><b>${esc(L.note)}:</b> ${esc(r.note)}</p>`:''}`;
    [...body.children].slice(4).forEach(el=>{ if(RTL[rl] && r!==g) el.dir='rtl'; });
  }catch(e){ if(!stale(sn,rl)) body.innerHTML = top + `<p class="msg err">${esc(t().failed)}</p>`; }
}

function shrink(file){ return new Promise(res=>{ if(!file) return res(''); const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,900/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); }; im.onerror=()=>res(''); im.src=fr.result; }; fr.onerror=()=>res(''); fr.readAsDataURL(file); }); }

  if(x.dataset.go){ view={v:x.dataset.go}; render(true); return; }
  if(x.dataset.pick){ toggle(+x.dataset.pick); return; }
  if(x.dataset.rec){ setRec(+x.dataset.rec, lang); return; }
  if(x.dataset.rl){ setRec(+x.dataset.sn, x.dataset.rl); return; }
  if(x.dataset.rm){ sel.delete(+x.dataset.rm); saveSel(); view={v:'form'}; render(); return; }
  if(x.id==='tray-go'){ view={v:'form'}; render(true); return; }
  if(x.dataset.gal){ showPhoto(+x.dataset.gal); return; }
  if(x.dataset.act==='cart'){ showCart(); return; }
  if(x.dataset.act==='cartclose'){ $('#dlg').close(); return; }
  if(x.dataset.act==='cartgo'){ $('#dlg').close(); view={v:'form'}; render(true); return; }
  if(x.dataset.rmcart){ sel.delete(+x.dataset.rmcart); cartChanged(); return; }
  if(x.dataset.rmcartc){ customSel.splice(+x.dataset.rmcartc,1); cartChanged(); return; }
  if(x.dataset.act==='exit'){ exitEdit(); return; }
  if(x.dataset.act==='addCustom'){ addCustom(x); return; }
  if(x.dataset.rmc){ customSel.splice(+x.dataset.rmc,1); view={v:view.v}; render(); return; }
  if(x.dataset.act==='save'){ saveEdit(x); return; }
  if(x.dataset.act==='cancelAll'){ if(window.confirm(t().confirmCancel)){ sel.clear(); saveEdit(x); } return; }
  if(x.dataset.act==='mine'){ const m=store.get('mine',null); if(m){ x.disabled=true; startManage(m.ref,m.token).catch(err=>{ x.disabled=false; alert(lang==='en'?err.message:t().err); }); } return; }
  if(x.id==='dlg-x'){ $('#dlg').close(); return; }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ q=e.target.value; $('#res').innerHTML=resultsHtml(); } });
document.addEventListener('change',e=>{ if(e.target.id==='ml'&&e.target.value) setRec(+e.target.dataset.sn, e.target.value); });
document.addEventListener('submit',e=>{ if(e.target.id==='lk') lookup(e); if(e.target.id==='f') submit(e); });
$('#dlg').addEventListener('close',()=>{ if(/^#r\d/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search); });
function fromHash(){ const mg=location.hash.match(/^#manage\/([A-Z0-9-]+)\/([\w-]+)$/); if(mg){ history.replaceState(null,'',location.pathname+location.search); startManage(mg[1],mg[2]).catch(err=>{ view={v:'home',lkMsg:lang==='en'?err.message:t().err,lkRef:mg[1]}; render(); }); return; } const m=location.hash.match(/^#r(\d+)(?:-([a-z]{2}(?:-[A-Z]{2})?))?$/); if(m&&BY[+m[1]]) setRec(+m[1], m[2]||lang); }
window.addEventListener('hashchange',fromHash);
$('#dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') e.target.close(); });

function drawLights(){
  const D='<svg viewBox="0 0 80 64"><path class="flame" d="M40 4 Q52 20 40 32 Q28 20 40 4Z" fill="#ffd36b"/><path d="M40 14 Q45 22 40 28 Q35 22 40 14Z" fill="#fff6d6"/><path d="M6 36 Q40 34 74 36 Q66 60 40 60 Q14 60 6 36Z" fill="#c8953a"/><path d="M14 42 Q40 48 66 42" stroke="#7a1426" stroke-width="2" fill="none" opacity=".45"/></svg>';
  $('#diyas').innerHTML=Array.from({length:11},(_,i)=>`<i style="animation-delay:${(i*.37%2).toFixed(2)}s">${D}</i>`).join('');
  $('#twinkles').innerHTML=Array.from({length:26},(_,i)=>`<b style="left:${(i*37%100)}%;top:${(i*53%88)+4}%;animation-delay:${(i*.29%3).toFixed(2)}s;transform:scale(${.6+(i%4)*.25})"></b>`).join('');
}
function drawMandala(){
  let g='';[[90,12,38],[170,16,60],[260,24,70],[360,32,84],[455,40,60]].forEach(([R,n,h],k)=>{
    const w=Math.PI*R/n*.9; g+=`<circle r="${R-h*.55}" fill="none" stroke="#f6e2a4" stroke-width="1.2"/>`;
    for(let i=0;i<n;i++){const a=(360/n*i+(k%2?180/n:0)).toFixed(2);
      g+=`<path transform="rotate(${a})" d="M0 ${-(R-h*.55)} C ${w*.6} ${-(R-h*.1)} ${w*.25} ${-(R+h*.35)} 0 ${-(R+h*.5)} C ${-w*.25} ${-(R+h*.35)} ${-w*.6} ${-(R-h*.1)} 0 ${-(R-h*.55)}Z" fill="none" stroke="#f6e2a4" stroke-width="1.1"/>`;
      if(k>1) g+=`<circle transform="rotate(${(+a+180/n).toFixed(2)})" cy="${-(R+h*.2)}" r="3" fill="#f6e2a4"/>`;}
  });
  $('#mandala').innerHTML=g+'<circle r="26" fill="none" stroke="#f6e2a4" stroke-width="1.5"/><circle r="8" fill="#f6e2a4"/>';
}
(function(){
  const d=$('#dlg');
  if(typeof d.showModal!=='function'){
    d.showModal=()=>{d.setAttribute('open','');d.classList.add('poly');};
    d.close=()=>{if(!d.hasAttribute('open'))return;d.removeAttribute('open');d.classList.remove('poly');d.dispatchEvent(new Event('close'));};
    Object.defineProperty(d,'open',{get(){return d.hasAttribute('open');}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')d.close();});
  }
  const sm=d.showModal.bind(d); d.showModal=()=>{sm();document.documentElement.classList.add('lock');};
  d.addEventListener('close',()=>document.documentElement.classList.remove('lock'));
})();
(async function init(){
  drawMandala(); drawLights();
  renderChrome();
  $('#app').innerHTML='<p><span class="spin"></span>Loading…</p>';
  DISHES = await (await fetch('data/dishes.json')).json();
  DISHES.forEach(d=>BY[d[0]]=d);
  [...sel].forEach(n=>{ if(!BY[n]) sel.delete(n); }); saveSel();
  render();
  refreshBooked(); setInterval(refreshBooked, 60000); loadCustom(); setInterval(loadCustom, 120000);
  fromHash();
  setTimeout(()=>{ loadStatic('gu'); if(lang!=='gu') loadStatic(lang); },2500);
  if(lang==='hi') loadHi();
})();
</script>
